services:
  frontend-fe6vn:
    image: localforge/frontend:0.1.0
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend-fe6vn
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    networks:
      - edge-net-ne2vk
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend-local.rule: Host(`localforge.localhost`)
      traefik.http.routers.frontend-local.entrypoints: web
      traefik.http.routers.frontend-local.priority: "10"
      traefik.http.routers.frontend-local.service: frontend
      traefik.http.routers.frontend-public.rule: Host(`localforge.datarohit.com`)
      traefik.http.routers.frontend-public.entrypoints: web
      traefik.http.routers.frontend-public.priority: "10"
      traefik.http.routers.frontend-public.service: frontend
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
      traefik.http.services.frontend.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.frontend.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.frontend.loadbalancer.healthcheck.timeout: 3s
  django-uv5n2:
    labels:
      traefik.http.routers.localforge-local.rule: >-
        Host(`localforge.localhost`) && (PathPrefix(`/api/`) || PathPrefix(`/ws/`) || PathPrefix(`/health/`)
        || PathPrefix(`/admin/`) || PathPrefix(`/static/`) || Path(`/api`) || Path(`/ws`) || Path(`/health`)
        || Path(`/admin`) || Path(`/static`))
      traefik.http.routers.localforge-local.priority: "100"
      traefik.http.routers.localforge-public.rule: >-
        Host(`localforge.datarohit.com`) && (PathPrefix(`/api/`) || PathPrefix(`/ws/`) || PathPrefix(`/health/`)
        || PathPrefix(`/admin/`) || PathPrefix(`/static/`) || Path(`/api`) || Path(`/ws`) || Path(`/health`)
        || Path(`/admin`) || Path(`/static`))
      traefik.http.routers.localforge-public.priority: "100"
