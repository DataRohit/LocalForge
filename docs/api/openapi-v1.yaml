openapi: 3.1.0
info:
  title: LocalForge API
  version: 1.0.0
  description: LocalForge is a local-first Django backend platform. This document
    defines its authenticated REST API, health endpoint, and account lifecycle operations.
    WebSocket protocol details are published separately.
  contact:
    name: Rohit Vilas Ingole
    email: datarohit@outlook.com
    url: https://github.com/DataRohit/LocalForge
  license:
    name: MIT License
    url: https://opensource.org/license/mit
paths:
  /api/v1/jwt/create/:
    post:
      operationId: jwt_create
      description: Authenticates an active account without revealing whether a rejected
        username exists. The response contains only a short-lived access token and
        a longer-lived refresh token.
      summary: Exchange credentials for JSON web tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTCreateResponse'
              examples:
                TokensIssued:
                  value:
                    access: <JWT>
                    refresh: <JWT>
                  summary: Tokens issued
          description: Credentials were accepted and both token types are returned.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MalformedJSON:
                  value:
                    code: parse_error
                    message: The request body could not be parsed.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Malformed JSON
                MissingUsername:
                  value:
                    code: validation_error
                    message: The submitted data is invalid.
                    details:
                      username:
                      - This field is required.
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Missing username
                InvalidHost:
                  summary: Invalid Host header
                  value:
                    code: bad_request
                    message: The request was invalid.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
          description: The request body is malformed or misses a required credential
            field.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
          - tests/integration/config/test_api.py::test_fixed_operation_invalid_host_returns_correlated_bad_request[jwt_create]
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AuthenticationFailed:
                  value:
                    code: authentication_failed
                    message: Authentication failed.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Authentication failed
          description: Credentials were rejected without disclosing account state.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MethodNotAllowed:
                  value:
                    code: method_not_allowed
                    message: The requested method is not allowed.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Method not allowed
          description: The JSON web token create endpoint accepts only POST.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NotAcceptable:
                  value:
                    code: not_acceptable
                    message: The requested response format is not available.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Not acceptable
          description: The requested response representation is unavailable.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RequestTooLarge:
                  value:
                    code: request_too_large
                    message: The request body is too large.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Request too large
          description: The request body exceeds the environment-configured API limit.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                UnsupportedMediaType:
                  value:
                    code: unsupported_media_type
                    message: The request content type is not supported.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Unsupported media type
          description: The submitted request representation is unsupported.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TooManyRequests:
                  value:
                    code: throttled
                    message: Too many requests.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Too many requests
          description: The client address or account identifier exceeded its configured
            login rate.
          headers:
            Retry-After:
              description: Whole seconds until the fixed or rolling admission window
                recovers.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Request correlation identifier echoed by the error envelope.
              schema:
                type: string
                format: uuid
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    code: internal_server_error
                    message: An unexpected error occurred.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Internal server error
          description: An unexpected server failure was contained.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ServiceUnavailable:
                  value:
                    code: service_unavailable
                    message: A required service is unavailable.
                    details: {}
                    request_id: 00000000-0000-4000-8000-000000000000
                  summary: Service unavailable
          description: Authoritative account, login-admission, or token-persistence
            state is unavailable.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
      security: []
      x-localforge-observed-by: tests/integration/accounts/test_jwt_authentication.py::test_jwt_create_observed_statuses_exactly_match_its_documented_contract
  /api/v1/jwt/refresh/:
    post:
      operationId: jwt_refresh
      description: Exchanges one valid refresh token for new access and refresh credentials.
        The account is locked before outstanding-token state, and the supplied refresh
        token is blacklisted atomically before its replacement is persisted.
      summary: Rotate a JSON web refresh token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JWTRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JWTRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTRefreshResponse'
              examples:
                TokensRotated:
                  value:
                    access: <JWT>
                    refresh: <JWT>
                  summary: Tokens rotated
          description: The refresh credential was rotated.
          x-localforge-observed-by:
          - tests/integration/accounts/test_jwt_authentication.py::test_jwt_token_operation_statuses_match_their_documented_contracts[refresh]
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
