  /api/v1/token/login/:
    post:
      operationId: token_login
      description: Authenticates an active account without revealing whether a rejected
        username exists. Stored password profiles outside the accepted bounded policy
        receive the same generic failure and fixed dummy work as an unknown account
        and require password reset. The returned DRF token is a single non-expiring
        credential stored in plaintext as its table key and should be used only where
        the secondary scheme is appropriate.
      summary: Exchange credentials for a token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                TokenIssued:
                  value:
                    token: 0123456789abcdef0123456789abcdef01234567
                  summary: Token issued
          description: Credentials were accepted and the account token is returned.
          x-localforge-observed-by:
          - tests/integration/accounts/test_token_authentication.py::test_login_observed_statuses_exactly_match_its_documented_contract
        '400':
