name: Bug report
description: Report a reproducible defect
title: "Bug: "

labels:
  - bug

body:
  - type: markdown
    attributes:
      value: Search existing issues and remove all secrets before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, private data, and unrelated output.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed secrets and sensitive information.
          required: true
        - label: This is not a security vulnerability.
          required: true
