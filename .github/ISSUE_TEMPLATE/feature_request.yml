name: Feature request
description: Propose a scoped improvement
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need or limitation without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success criteria.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the approach, alternatives, and tradeoffs.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operational and compatibility impact
      description: Cover Docker, local workflows, security, stored data, and migration needs.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing request.
          required: true
        - label: I described the problem and measurable outcome.
          required: true
