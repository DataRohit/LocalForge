worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-errors warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    add_header_inherit merge;
    log_format structured escape=json '{"level":"INFO","logger":"nginx.access","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout structured;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ ^/(api|ws|health|admin|static)(/|$) {
            return 404;
        }

        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
