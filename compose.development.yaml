services:
  traefik-tk2jp:
    image: docker.io/library/traefik:v3.7.13
    container_name: traefik-tk2jp
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8080"

    networks:
      - edge-net-ne2vk

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.dashboard.entrypoints=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

    depends_on:
      django-uv5n2:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-pg3ka:
    image: localforge/pgbackrest:18.6
    build:
      context: .
      dockerfile: docker/pgbackrest/Dockerfile
      provenance: false
    container_name: postgres-pg3ka
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      data-net-nd9pc:
        aliases:
          - postgres-primary-nd9pc
      access-net-ha4mz: {}

    volumes:
      - postgres-pg3ka-data:/var/lib/postgresql
      - postgres-pg3ka-socket:/var/run/pgsocket
      - pgbackrest-pb2wj-repo:/var/lib/pgbackrest
      - ./docker/postgres/primary/conf.d:/etc/postgresql/conf.d:ro
      - ./docker/postgres/primary/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-replica-pg6vy:
    image: docker.io/library/postgres:18.6
    container_name: postgres-replica-pg6vy
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:5433:5432"

    networks:
      - data-net-nd9pc
      - access-net-ha4mz

    volumes:
      - postgres-replica-pg6vy-data:/var/lib/postgresql
      - ./docker/postgres/standby/conf.d:/etc/postgresql/conf.d:ro
      - ./scripts/pg_replica_bootstrap.sh:/usr/local/bin/pg_replica_bootstrap.sh:ro

    entrypoint: ["/usr/local/bin/pg_replica_bootstrap.sh"]
    command: ["postgres"]

    depends_on:
      postgres-pg3ka:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT pg_is_in_recovery()')" = t
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  pgbackrest-pb2wj:
    image: localforge/pgbackrest:18.6
    build:
      context: .
      dockerfile: docker/pgbackrest/Dockerfile
      provenance: false
    container_name: pgbackrest-pb2wj
    restart: on-failure:5
    user: postgres

    env_file:
      - .env.development

    networks:
      - data-net-nd9pc

    volumes:
      - pgbackrest-pb2wj-repo:/var/lib/pgbackrest
      - postgres-pg3ka-data:/var/lib/postgresql:ro
      - postgres-pg3ka-socket:/var/run/pgsocket

    entrypoint: ["/usr/local/bin/pgbackrest_entrypoint.sh"]
    command: []

    depends_on:
      postgres-pg3ka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgbackrest --stanza=$$PGBACKREST_STANZA info | grep -q 'status: ok'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  valkey-cache-vc5tn:
    image: docker.io/valkey/valkey:9.1.2
    container_name: valkey-cache-vc5tn
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:6379:6379"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    volumes:
      - valkey-cache-vc5tn-data:/data

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$VALKEY_CACHE_PASSWORD"
        --maxmemory "$$VALKEY_CACHE_MAXMEMORY"
        --maxmemory-policy "$$VALKEY_CACHE_MAXMEMORY_POLICY"
        --dir /data
        --save 60 1

    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_CACHE_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  valkey-channels-vh8dm:
    image: docker.io/valkey/valkey:9.1.2
    container_name: valkey-channels-vh8dm
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:6380:6379"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    volumes:
      - valkey-channels-vh8dm-data:/data

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$VALKEY_CHANNELS_PASSWORD"
        --dir /data
        --save 60 1

    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_CHANNELS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq-rq4sx:
    image: docker.io/library/rabbitmq:4.3.5-management
    container_name: rabbitmq-rq4sx
    hostname: rabbitmq-rq4sx
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    volumes:
      - rabbitmq-rq4sx-data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q check_running
          && rabbitmq-diagnostics -q check_local_alarms
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  seaweedfs-sw9cr:
    image: docker.io/chrislusf/seaweedfs:4.46
    container_name: seaweedfs-sw9cr
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:8333:8333"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    volumes:
      - seaweedfs-sw9cr-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json.template:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        : "$${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is unset}"
        && : "$${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is unset}"
        && : "$${WEED_S3_SSE_KEK_PASSPHRASE:?WEED_S3_SSE_KEK_PASSPHRASE is unset}"
        && sed -e "s|__S3_ACCESS_KEY_ID__|$$S3_ACCESS_KEY_ID|"
        -e "s|__S3_SECRET_ACCESS_KEY__|$$S3_SECRET_ACCESS_KEY|"
        /etc/seaweedfs/s3.json.template > /etc/seaweedfs/s3.json
        && exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
        -s3.iam=false
        -s3.port.iceberg=0 -s3.port.lance=0 -ip.bind=0.0.0.0
        -master.telemetry=false

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/healthz
          && wget -q -O /dev/null http://127.0.0.1:8333/healthz
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  mailpit-mp6gb:
    image: docker.io/axllent/mailpit:v1.31.1
    container_name: mailpit-mp6gb
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    volumes:
      - mailpit-mp6gb-data:/data

    command:
      - --database
      - /data/mailpit.db
      - --disable-version-check
      - --smtp-disable-rdns
      - --block-remote-css-and-fonts
      - --allowed-hosts
      - localhost,127.0.0.1

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  cadvisor-cv8mh:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor-cv8mh
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - obsv-net-nb4xt

    volumes:
      - ./docker/cadvisor/machine-id:/etc/machine-id:ro
      - ./docker/cadvisor/machine-id:/rootfs/etc/machine-id:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    devices:
      - /dev/kmsg:/dev/kmsg:r

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-exporter-pe4rk:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter-pe4rk
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - data-net-nd9pc
      - obsv-net-nb4xt

    volumes:
      - ./docker/postgres-exporter/auth_modules.yaml:/etc/pe/auth_modules.yaml.template:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__POSTGRES_USER__|$$POSTGRES_USER|"
        -e "s|__POSTGRES_PASSWORD__|$$POSTGRES_PASSWORD|" -e "s|__POSTGRES_DB__|$$POSTGRES_DB|"
        /etc/pe/auth_modules.yaml.template > /tmp/auth_modules.yaml
        && DATA_SOURCE_URI="postgres-pg3ka:5432/localforge?sslmode=disable"
        DATA_SOURCE_USER="$$POSTGRES_USER"
        DATA_SOURCE_PASS="$$POSTGRES_PASSWORD"
        exec /bin/postgres_exporter --config.file=/tmp/auth_modules.yaml

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  valkey-cache-exporter-ve7ts:
    image: docker.io/oliver006/redis_exporter:v1.91.1
    container_name: valkey-cache-exporter-ve7ts
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - app-net-na6hy
      - obsv-net-nb4xt

    command:
      - --redis.addr=redis://valkey-cache-vc5tn:6379
      - --redis.password=${VALKEY_CACHE_PASSWORD}

  valkey-channels-exporter-vx4nq:
    image: docker.io/oliver006/redis_exporter:v1.91.1
    container_name: valkey-channels-exporter-vx4nq
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - app-net-na6hy
      - obsv-net-nb4xt

    command:
      - --redis.addr=redis://valkey-channels-vh8dm:6379
      - --redis.password=${VALKEY_CHANNELS_PASSWORD}

  loki-lk3ny:
    image: docker.io/grafana/loki:3.7.7
    container_name: loki-lk3ny
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - obsv-net-nb4xt

    volumes:
      - loki-lk3ny-data:/loki
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro

    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true

  alloy-al6wz:
    image: docker.io/grafana/alloy:v1.19.2
    container_name: alloy-al6wz
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - obsv-net-nb4xt

    depends_on:
      loki-lk3ny:
        condition: service_started

    volumes:
      - alloy-al6wz-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus-pm5db:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: prometheus-pm5db
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - obsv-net-nb4xt

    depends_on:
      postgres-exporter-pe4rk:
        condition: service_healthy
      valkey-cache-exporter-ve7ts:
        condition: service_started
      valkey-channels-exporter-vx4nq:
        condition: service_started
      cadvisor-cv8mh:
        condition: service_healthy
      django-uv5n2:
        condition: service_healthy

    volumes:
      - prometheus-pm5db-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time="$$PROMETHEUS_RETENTION_TIME"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  grafana-gf7qv:
    image: docker.io/grafana/grafana-oss:13.0.2
    container_name: grafana-gf7qv
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - obsv-net-nb4xt
      - access-net-ha4mz

    depends_on:
      prometheus-pm5db:
        condition: service_healthy
      loki-lk3ny:
        condition: service_started

    volumes:
      - grafana-gf7qv-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export GF_SECURITY_ADMIN_USER="$$GRAFANA_ADMIN_USER"
        GF_SECURITY_ADMIN_PASSWORD="$$GRAFANA_ADMIN_PASSWORD"
        GF_ANALYTICS_REPORTING_ENABLED=false
        GF_ANALYTICS_CHECK_FOR_UPDATES=false
        GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
        GF_USERS_ALLOW_SIGN_UP=false
        GF_AUTH_ANONYMOUS_ENABLED=false
        GF_PLUGINS_PREINSTALL_DISABLED=true
        GF_NEWS_NEWS_FEED_ENABLED=false
        && exec /run.sh

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  pgadmin-pa7fe:
    image: docker.io/dpage/pgadmin4:9.17
    container_name: pgadmin-pa7fe
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:5050:80"

    networks:
      - data-net-nd9pc
      - access-net-ha4mz

    depends_on:
      postgres-pg3ka:
        condition: service_healthy
      postgres-replica-pg6vy:
        condition: service_healthy

    volumes:
      - pgadmin-pa7fe-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sqlite3,urllib.request;
          urllib.request.urlopen('http://127.0.0.1:80/misc/ping').read();
          c=sqlite3.connect('file:/var/lib/pgadmin/pgadmin4.db?mode=ro',uri=True);
          assert c.execute('select count(*) from user').fetchone()[0];
          assert {r[0] for r in c.execute('select host from server')} ==
          {'postgres-pg3ka','postgres-replica-pg6vy'}
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  django-uv5n2:
    image: localforge/django:0.1.0
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      provenance: false
      target: runtime
    container_name: django-uv5n2
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      edge-net-ne2vk: {}
      app-net-na6hy: {}
      data-net-nd9pc: {}
      obsv-net-nb4xt:
        aliases:
          - django-metrics-nb4xt
      access-net-ha4mz: {}

    volumes:
      - django-uv5n2-static:/app/staticfiles

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.localforge.rule=Host(`localforge.localhost`)"
      - "traefik.http.routers.localforge.entrypoints=web"
      - "traefik.http.routers.localforge.service=localforge"
      - "traefik.http.services.localforge.loadbalancer.server.port=8000"
      - "traefik.http.services.localforge.loadbalancer.healthcheck.path=/health/"
      - "traefik.http.services.localforge.loadbalancer.healthcheck.hostname=localforge.localhost"
      - "traefik.http.services.localforge.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.localforge.loadbalancer.healthcheck.timeout=3s"

    depends_on:
      postgres-pg3ka:
        condition: service_healthy
      postgres-replica-pg6vy:
        condition: service_healthy
      valkey-cache-vc5tn:
        condition: service_healthy
      valkey-channels-vh8dm:
        condition: service_healthy
      rabbitmq-rq4sx:
        condition: service_healthy
      seaweedfs-sw9cr:
        condition: service_healthy
      mailpit-mp6gb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/').read()
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  celery-worker-cw8rt:
    image: localforge/django:0.1.0
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      provenance: false
      target: runtime
    container_name: celery-worker-cw8rt
    hostname: celery-worker-cw8rt
    restart: unless-stopped
    stop_grace_period: ${CELERY_WORKER_SHUTDOWN_TIMEOUT_SECONDS}s

    env_file:
      - .env.development

    networks:
      - app-net-na6hy
      - data-net-nd9pc

    command:
      - celery
      - -A
      - config
      - worker
      - --hostname=celery@celery-worker-cw8rt
      - --loglevel=${DJANGO_LOG_LEVEL}
      - --concurrency=${CELERY_WORKER_CONCURRENCY}
      - --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER}
      - --queues=localforge.v2.default,localforge.v2.slow
      - --events

    depends_on:
      django-uv5n2:
        condition: service_healthy
      rabbitmq-rq4sx:
        condition: service_healthy
      valkey-cache-vc5tn:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec python scripts/celery_worker_health.py
          --destination celery@celery-worker-cw8rt
          --timeout "$$CELERY_WORKER_HEALTH_TIMEOUT_SECONDS"
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  celery-beat-cb4hq:
    image: localforge/django:0.1.0
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      provenance: false
      target: runtime
    container_name: celery-beat-cb4hq
    hostname: celery-beat-cb4hq
    restart: unless-stopped

    env_file:
      - .env.development

    networks:
      - app-net-na6hy
      - data-net-nd9pc

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=${DJANGO_LOG_LEVEL}
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
      - --max-interval=${CELERY_BEAT_MAX_LOOP_INTERVAL_SECONDS}

    depends_on:
      django-uv5n2:
        condition: service_healthy
      rabbitmq-rq4sx:
        condition: service_healthy
      valkey-cache-vc5tn:
        condition: service_healthy

  flower-fl9zd:
    image: localforge/django:0.1.0
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      provenance: false
      target: runtime
    container_name: flower-fl9zd
    hostname: flower-fl9zd
    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:5555:5555"

    networks:
      - app-net-na6hy
      - access-net-ha4mz

    command:
      - celery
      - -A
      - config
      - flower
      - --port=5555

    depends_on:
      celery-worker-cw8rt:
        condition: service_healthy
      rabbitmq-rq4sx:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import base64,os,urllib.request;
          credential=base64.b64encode(os.environ["FLOWER_BASIC_AUTH"].encode()).decode();
          request=urllib.request.Request(
          "http://127.0.0.1:5555/",
          headers={"Authorization":f"Basic {credential}"});
          urllib.request.urlopen(request,timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

networks:
  edge-net-ne2vk:
    name: edge-net-ne2vk
    driver: bridge
    ipam:
      config:
