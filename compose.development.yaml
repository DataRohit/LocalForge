services:
  postgres-pg3ka:
    image: localforge/pgbackrest:18.6
    build:
      context: .
      dockerfile: docker/pgbackrest/Dockerfile
    container_name: postgres-pg3ka
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - "5432:5432"
    networks:
      data-net-nd9pc:
        aliases:
          - postgres-primary-nd9pc
      access-net-ha4mz: {}
    volumes:
      - postgres-pg3ka-data:/var/lib/postgresql
      - postgres-pg3ka-socket:/var/run/pgsocket
      - pgbackrest-pb2wj-repo:/var/lib/pgbackrest
      - ./docker/postgres/primary/conf.d:/etc/postgresql/conf.d:ro
      - ./docker/postgres/primary/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-replica-pg6vy:
    image: docker.io/library/postgres:18.6
    container_name: postgres-replica-pg6vy
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - "5433:5432"
    networks:
      - data-net-nd9pc
      - access-net-ha4mz
    volumes:
      - postgres-replica-pg6vy-data:/var/lib/postgresql
      - ./docker/postgres/standby/conf.d:/etc/postgresql/conf.d:ro
      - ./scripts/pg_replica_bootstrap.sh:/usr/local/bin/pg_replica_bootstrap.sh:ro
    entrypoint: ["/usr/local/bin/pg_replica_bootstrap.sh"]
    command: ["postgres"]
    depends_on:
      postgres-pg3ka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT pg_is_in_recovery()')" = t
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  pgbackrest-pb2wj:
    image: localforge/pgbackrest:18.6
    build:
      context: .
      dockerfile: docker/pgbackrest/Dockerfile
    container_name: pgbackrest-pb2wj
    restart: on-failure:5
    user: postgres
    env_file:
      - .env.development
    networks:
      - data-net-nd9pc
    volumes:
      - pgbackrest-pb2wj-repo:/var/lib/pgbackrest
      - postgres-pg3ka-data:/var/lib/postgresql:ro
      - postgres-pg3ka-socket:/var/run/pgsocket
    entrypoint: ["/usr/local/bin/pgbackrest_entrypoint.sh"]
    command: []
    depends_on:
      postgres-pg3ka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgbackrest --stanza=$$PGBACKREST_STANZA info | grep -q 'status: ok'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

networks:
  edge-net-ne2vk:
    name: edge-net-ne2vk
    driver: bridge
  access-net-ha4mz:
    name: access-net-ha4mz
    driver: bridge
  app-net-na6hy:
    name: app-net-na6hy
    driver: bridge
    internal: true
  data-net-nd9pc:
    name: data-net-nd9pc
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.89.4.0/24
  obsv-net-nb4xt:
    name: obsv-net-nb4xt
    driver: bridge
    internal: true

volumes:
  postgres-pg3ka-data:
    name: postgres-pg3ka-data
  postgres-pg3ka-socket:
    name: postgres-pg3ka-socket
  postgres-replica-pg6vy-data:
    name: postgres-replica-pg6vy-data
  pgbackrest-pb2wj-repo:
    name: pgbackrest-pb2wj-repo
  pgadmin-pa7fe-data:
    name: pgadmin-pa7fe-data
  valkey-cache-vc5tn-data:
    name: valkey-cache-vc5tn-data
  valkey-channels-vh8dm-data:
    name: valkey-channels-vh8dm-data
  rabbitmq-rq4sx-data:
    name: rabbitmq-rq4sx-data
  mailpit-mp6gb-data:
    name: mailpit-mp6gb-data
  seaweedfs-sw9cr-data:
    name: seaweedfs-sw9cr-data
  prometheus-pm5db-data:
    name: prometheus-pm5db-data
  grafana-gf7qv-data:
    name: grafana-gf7qv-data
  loki-lk3ny-data:
    name: loki-lk3ny-data
  alloy-al6wz-data:
    name: alloy-al6wz-data
  django-uv5n2-static:
    name: django-uv5n2-static
