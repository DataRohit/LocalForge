minimum_pre_commit_version: 4.6.2
exclude: ^\.agents/

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1000
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
        exclude: '\.(bat|cmd|ps1)$'
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend poe -C backend lint
        language: system
        pass_filenames: false
        types:
          - python

      - id: ruff-format
        name: ruff format
        entry: uv run --project backend poe -C backend format
        language: system
        pass_filenames: false
        types:
          - python

      - id: docs-standard
        name: documentation standard
        entry: uv run --project backend poe -C backend docs-standard
        language: system
        pass_filenames: false
        types:
          - python

      - id: mypy
        name: mypy
        entry: uv run --project backend poe -C backend types-mypy
        language: system
        stages:
          - pre-push
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run --project backend poe -C backend types-ty
        language: system
        stages:
          - pre-push
        pass_filenames: false

      - id: pytest
        name: pytest with coverage
        entry: uv run --project backend poe -C backend test
        language: system
        stages:
          - pre-push
        pass_filenames: false

      - id: validate-commit-message
        name: validate commit message
        entry: uv run --project backend python .github/scripts/validate_commit_message.py
        language: system
        stages:
          - commit-msg
        always_run: true
