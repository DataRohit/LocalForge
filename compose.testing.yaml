services:
  postgres-tp8vn:
    image: docker.io/library/postgres:18.6
    container_name: postgres-tp8vn
    restart: unless-stopped
    env_file:
      - .env.testing
    ports:
      - "25432:5432"
    networks:
      - data-net-nt8fq
      - access-net-ht6pn
    volumes:
      - postgres-tp8vn-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey-cache-tv4kq:
    image: docker.io/valkey/valkey:9.1.2
    container_name: valkey-cache-tv4kq
    restart: unless-stopped
    env_file:
      - .env.testing
    ports:
      - "26379:6379"
    networks:
      - app-net-nt5rk
      - access-net-ht6pn
    volumes:
      - valkey-cache-tv4kq-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$VALKEY_CACHE_PASSWORD"
        --maxmemory "$$VALKEY_CACHE_MAXMEMORY"
        --maxmemory-policy "$$VALKEY_CACHE_MAXMEMORY_POLICY"
        --dir /data
        --save 60 1
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_CACHE_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  valkey-channels-tv9zw:
    image: docker.io/valkey/valkey:9.1.2
    container_name: valkey-channels-tv9zw
    restart: unless-stopped
    env_file:
      - .env.testing
    ports:
      - "26380:6379"
    networks:
      - app-net-nt5rk
      - access-net-ht6pn
    volumes:
      - valkey-channels-tv9zw-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$VALKEY_CHANNELS_PASSWORD"
        --dir /data
        --save 60 1
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_CHANNELS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq-tr6mc:
    image: docker.io/library/rabbitmq:4.3.5
    container_name: rabbitmq-tr6mc
    hostname: rabbitmq-tr6mc
    restart: unless-stopped
    env_file:
      - .env.testing
    ports:
      - "25672:5672"
    networks:
      - app-net-nt5rk
      - access-net-ht6pn
    volumes:
      - rabbitmq-tr6mc-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q check_running
          && rabbitmq-diagnostics -q check_local_alarms
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  seaweedfs-ts3jd:
    image: docker.io/chrislusf/seaweedfs:4.46
    container_name: seaweedfs-ts3jd
    restart: unless-stopped
    env_file:
      - .env.testing
    ports:
      - "28333:8333"
      - "29333:9333"
    networks:
      - app-net-nt5rk
      - access-net-ht6pn
    volumes:
      - seaweedfs-ts3jd-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json.template:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        : "$${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is unset}"
        && : "$${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is unset}"
        && sed -e "s|__S3_ACCESS_KEY_ID__|$$S3_ACCESS_KEY_ID|"
        -e "s|__S3_SECRET_ACCESS_KEY__|$$S3_SECRET_ACCESS_KEY|"
        /etc/seaweedfs/s3.json.template > /etc/seaweedfs/s3.json
        && exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
        -s3.port.iceberg=0 -s3.port.lance=0 -ip.bind=0.0.0.0
        -master.telemetry=false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/healthz
          && wget -q -O /dev/null http://127.0.0.1:8333/healthz
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

networks:
  access-net-ht6pn:
    name: access-net-ht6pn
    driver: bridge
  app-net-nt5rk:
    name: app-net-nt5rk
    driver: bridge
    internal: true
  data-net-nt8fq:
    name: data-net-nt8fq
    driver: bridge
    internal: true

volumes:
  postgres-tp8vn-data:
    name: postgres-tp8vn-data
  valkey-cache-tv4kq-data:
    name: valkey-cache-tv4kq-data
  valkey-channels-tv9zw-data:
    name: valkey-channels-tv9zw-data
  rabbitmq-tr6mc-data:
    name: rabbitmq-tr6mc-data
  seaweedfs-ts3jd-data:
    name: seaweedfs-ts3jd-data
  mailpit-tm7bh-data:
    name: mailpit-tm7bh-data
