[project]
name = "localforge"
version = "0.1.0"
description = "A local-first Django application with strict quality standards"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rohit Vilas Ingole", email = "datarohit@outlook.com" },
]
maintainers = [
    { name = "Rohit Vilas Ingole", email = "datarohit@outlook.com" },
]
keywords = [
    "django",
    "local-first",
    "python",
    "web-application",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "asgiref>=3.9.1",
    "boto3>=1.40.0",
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.0,<6.1",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-health-check[celery,rabbitmq,redis]>=4.5.1",
    "django-prometheus>=2.5.0",
    "django-storages[s3]==1.14.6",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.9.1",
    "flower>=2.1.0",
    "psycopg[binary,pool]>=3.3.5",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/DataRohit/LocalForge"
Repository = "https://github.com/DataRohit/LocalForge.git"
Issues = "https://github.com/DataRohit/LocalForge/issues"
Changelog = "https://github.com/DataRohit/LocalForge/blob/master/CHANGELOG.md"
Documentation = "https://github.com/DataRohit/LocalForge#readme"

[tool.uv]
package = false
system-certs = true

[[tool.uv.index]]
name = "microsoft-package-feed"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "bcrypt>=5.0.0",
    "boto3-stubs[s3]>=1.40.0",
    "coverage[toml]>=7.16.0",
    "django-stubs[compatible-mypy]>=6.1.0",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "hypothesis>=6.167.1",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.5.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "."]
extend-exclude = [".agents"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403"]
"src/config/celery.py" = ["A002"]
"src/accounts/password_management.py" = ["BLE001"]
"src/accounts/tasks.py" = ["BLE001"]
"src/accounts/username_management.py" = ["BLE001"]
"src/manage.py" = ["PLC0415"]
"**/migrations/*.py" = ["D", "E501", "RUF012"]
"scripts/*.py" = ["T201", "TC003"]
"scripts/gen_secrets.py" = ["S603"]
"scripts/preflight.py" = ["S603"]
"scripts/sops_env.py" = ["S603"]
"scripts/manage_platform.py" = ["S603"]
"scripts/audit_security.py" = ["S603"]
"tests/**/*.py" = ["S101"]
"tests/conftest.py" = ["S101", "SLF001"]
"tests/websocket.py" = ["ANN401", "ASYNC109", "S101"]
"tests/unit/conftest.py" = ["S101", "S603"]
"tests/unit/config/test_celery.py" = ["S101", "SLF001"]
"tests/unit/test_harness.py" = ["S101", "S603"]
"tests/unit/scripts/test_django_entrypoint.py" = ["S101", "S603"]
"tests/integration/config/test_worker_service.py" = ["S603"]
"tests/integration/config/test_task_queue.py" = ["S101", "SLF001"]
"tests/integration/notifications/test_task_fanout.py" = ["S603"]
".github/scripts/validate_commit_message.py" = ["C901", "INP001", "PLR0912"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
files = ["src", "tests", "scripts", ".github/scripts"]
exclude = '(^|[\\/])\.agents([\\/]|$)'
mypy_path = "src"
strict = true
extra_checks = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.django-stubs]
django_settings_module = "config.settings.testing"
strict_settings = true

[[tool.mypy.overrides]]
module = [
    "environ.*",
    "amqp.*",
    "health_check.*",
    "channels.*",
    "channels_redis.*",
    "celery.*",
    "django_celery_beat.*",
    "kombu.*",
    "rest_framework.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["accounts.api_throttling"]
disable_error_code = ["misc"]

[tool.ty.environment]
python = ".venv"
python-version = "3.14"
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "scripts", ".github/scripts"]
exclude = [".agents/**"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
minversion = "9.1"
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--timeout=60",
    "--timeout-method=thread",
    "--reuse-db",
    "--ignore=.agents",
    "--strict-config",
    "--strict-markers",
    "--cov=src",
    "--cov=scripts",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=100",
    "--no-cov-on-fail",
    "--junitxml=test-results/pytest-focused.xml",
]
markers = [
    "unit: isolated unit tests",
    "integration: tests spanning Django components",
    "services(*names): external services an integration test requires",
    "api_runtime: integration tests dispatching the fixed /api/v1/ application boundary",
    "api_runtime_exempt: non-API or source-only case in an api_runtime-marked module",
    "serial: tests that must not share a worker pool, justified in the test docstring",
    "security_timing: statistical wall-clock security criteria run in the bounded timing stage",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src", "scripts"]
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.poe.tasks.dev]
help = "Start the ASGI development server (needs the development stack reachable)"
cmd = """uvicorn config.asgi:application
  --app-dir src
  --host 127.0.0.1
  --port 8000
  --reload
  --reload-dir src
  --ws websockets-sansio"""

[tool.poe.tasks.help]
help = "Show LocalForge setup, environment, testing, and maintenance commands"
cmd = "python -m scripts.manage_platform help"

[tool.poe.tasks.setup]
help = "Check prerequisites and safely prepare all local environment files"
cmd = "python -m scripts.manage_platform setup"

[tool.poe.tasks.environments-setup]
help = "Bootstrap missing images, start, time, and audit both environments without tests"
cmd = "python -m scripts.manage_platform environments-setup"

[tool.poe.tasks.docker-audit]
help = "Verify LocalForge Docker names, ownership labels, health, and resources"
cmd = "python -m scripts.manage_platform docker-audit"

[tool.poe.tasks.docker-clean-check]
help = "Require zero LocalForge Docker containers, networks, volumes, and images"
cmd = "python -m scripts.manage_platform docker-clean-check"

[tool.poe.tasks.convention-audit]
help = "Audit live Docker conventions for both LocalForge environments"
cmd = "python -m scripts.audit_naming --environment all"

[tool.poe.tasks.convention-audit-development]
help = "Audit live Docker conventions for development"
cmd = "python -m scripts.audit_naming --environment development"

[tool.poe.tasks.convention-audit-testing]
help = "Audit live Docker conventions for testing"
cmd = "python -m scripts.audit_naming --environment testing"

[tool.poe.tasks.security-audit]
help = "Run deployment, history, dependency, image, exposure, and runtime secret audits"
cmd = "python -m scripts.audit_security --scope all"

[tool.poe.tasks.security-audit-static]
help = "Run deployment, history, dependency, and image vulnerability audits"
sequence = [
    { cmd = "python -m scripts.audit_security --scope deployment" },
    { cmd = "python -m scripts.audit_security --scope history" },
    { cmd = "python -m scripts.audit_security --scope dependencies" },
    { cmd = "python -m scripts.audit_security --scope images" },
]

[tool.poe.tasks.security-audit-runtime]
help = "Verify protected dashboards, private ports, broker users, image layers, and logs"
cmd = "python -m scripts.audit_security --scope runtime"

[tool.poe.tasks.secrets-generate]
help = "Create or top up local environment files without replacing existing values"
cmd = "python -m scripts.manage_platform secrets-generate"

[tool.poe.tasks.secrets-decrypt]
help = "Decrypt committed development and testing environment files"
cmd = "python -m scripts.manage_platform secrets-decrypt"

[tool.poe.tasks.developer-access-export]
help = "Create browser bookmarks and password imports for development services"
cmd = "python -m scripts.manage_platform developer-access-export"

[tool.poe.tasks.development-build]
help = "Build development images while preserving containers and volumes"
cmd = "python -m scripts.manage_platform development-build"

[tool.poe.tasks.development-up]
help = "Build if needed and start the complete development environment"
cmd = "python -m scripts.manage_platform development-up"

[tool.poe.tasks.development-down]
help = "Stop development containers while preserving named volumes"
cmd = "python -m scripts.manage_platform development-down"

[tool.poe.tasks.development-rebuild]
help = "Rebuild and recreate development containers while preserving named volumes"
cmd = "python -m scripts.manage_platform development-rebuild"

[tool.poe.tasks.development-reset]
help = "Destructively reset development volumes and rebuild without cache"
cmd = "python -m scripts.manage_platform development-reset --confirm-destroy-data"

[tool.poe.tasks.development-status]
help = "Show all development containers and their state"
cmd = "python -m scripts.manage_platform development-status"

[tool.poe.tasks.development-health]
help = "Verify development Compose state and aggregate application readiness"
cmd = "python -m scripts.manage_platform development-health"

[tool.poe.tasks.development-logs]
help = "Show the last 200 development log lines; pass --follow or service names"
cmd = "python -m scripts.manage_platform development-logs"

[tool.poe.tasks.testing-build]
help = "Build the source-matched testing image"
cmd = "python -m scripts.manage_platform testing-build"

[tool.poe.tasks.testing-up]
help = "Build if needed and start the complete headless testing environment"
cmd = "python -m scripts.manage_platform testing-up"

[tool.poe.tasks.testing-down]
help = "Stop testing containers while preserving named volumes"
cmd = "python -m scripts.manage_platform testing-down"

[tool.poe.tasks.testing-rebuild]
help = "Rebuild the test image and recreate the headless testing environment"
cmd = "python -m scripts.manage_platform testing-rebuild"

[tool.poe.tasks.testing-reset]
help = "Destructively reset testing volumes and rebuild without cache"
cmd = "python -m scripts.manage_platform testing-reset --confirm-destroy-data"

[tool.poe.tasks.testing-status]
help = "Show all testing containers and their state"
cmd = "python -m scripts.manage_platform testing-status"

[tool.poe.tasks.testing-health]
help = "Verify every testing dependency through its host readiness probe"
cmd = "python -m scripts.manage_platform testing-health"

[tool.poe.tasks.testing-logs]
help = "Show the last 200 testing log lines; pass --follow or service names"
cmd = "python -m scripts.manage_platform testing-logs"

[tool.poe.tasks.testing-test-container]
help = "Start testing and run the complete suite inside the persistent test service"
cmd = "python -m scripts.manage_platform testing-test-container"

[tool.poe.tasks.testing-test-host]
help = "Start testing dependencies and run the complete suite from the host"
cmd = "python -m scripts.manage_platform testing-test-host"

[tool.poe.tasks.testing-test-both]
help = "Start testing dependencies and run container mode followed by host mode"
cmd = "python -m scripts.manage_platform testing-test-both"

[tool.poe.tasks.testing-integration-audit]
help = "Prove Mailpit persistence and real degraded readiness in both test modes"
cmd = "python -m scripts.manage_platform testing-integration-audit"

[tool.poe.tasks.testing-verify]
help = "Rebuild testing, run both complete modes, and stop after success"
cmd = "python -m scripts.manage_platform testing-verify"

[tool.poe.tasks.migrate]
help = "Apply database migrations (development database; run from inside django-uv5n2)"
cmd = "python src/manage.py migrate"

[tool.poe.tasks.migrations]
help = "Create database migrations"
cmd = "python src/manage.py makemigrations"

[tool.poe.tasks.superuser]
help = "Create a Django superuser (development database; run from inside django-uv5n2)"
cmd = "python src/manage.py createsuperuser"

[tool.poe.tasks.shell]
help = "Open the Django shell (development database; run from inside django-uv5n2)"
cmd = "python src/manage.py shell"

[tool.poe.tasks.django-check]
help = "Run Django system and migration checks"
sequence = [
    { cmd = "python -m scripts.manage_platform testing-health" },
    { cmd = "python src/manage.py check", env = { DJANGO_SETTINGS_MODULE = "config.settings.development" } },
    { cmd = "python src/manage.py check --database default", env = { DJANGO_SETTINGS_MODULE = "config.settings.testing" } },
    { cmd = "python src/manage.py makemigrations --check --dry-run", env = { DJANGO_SETTINGS_MODULE = "config.settings.testing" } },
]

[tool.poe.tasks.openapi-generate]
help = "Generate the validated warning-free OpenAPI 3.1 artifact"
cmd = "python src/manage.py spectacular --validate --fail-on-warn --file docs/api/openapi-v1.yaml"

[tool.poe.tasks.openapi-check]
help = "Verify the fixed API contract and committed generated artifacts"
cmd = "pytest tests/unit/config/test_openapi_contract.py --no-cov -q"

[tool.poe.tasks.docs-standard]
help = "Check the no-comment rule and the docstring section structure"
cmd = "python scripts/check_docstrings.py"

[tool.poe.tasks.lint]
help = "Run Ruff lint checks"
cmd = "ruff check src tests scripts .github/scripts"

[tool.poe.tasks.format]
help = "Format Python code with Ruff"
cmd = "ruff format src tests scripts .github/scripts"

[tool.poe.tasks.format-check]
help = "Verify Python formatting without changing files"
cmd = "ruff format --check src tests scripts .github/scripts"

[tool.poe.tasks.types-mypy]
help = "Run strict mypy type checking"
cmd = "mypy"

[tool.poe.tasks.types-ty]
help = "Run strict ty type checking"
cmd = "uvx ty@0.0.78 check --force-exclude"

[tool.poe.tasks.typecheck]
help = "Run all type checkers"
sequence = ["types-mypy", "types-ty"]

[tool.poe.tasks.architecture-audit]
help = "Enforce stable runtime import direction and acyclic project dependencies"
cmd = "pytest tests/unit/test_architecture.py --no-cov -q"

[tool.poe.tasks.test]
help = "Start testing dependencies and run the complete host suite"
cmd = "python -m scripts.manage_platform testing-test-host"

[tool.poe.tasks.test-stages]
help = "Run the complete core and security timing stages with dependencies already prepared"
sequence = ["test-core", "test-security-timing"]

[tool.poe.tasks.test-serial]
help = "Run the whole suite in one process; re-run this to read a timeout's stack"
cmd = "python -m scripts.manage_platform testing-test-host-serial"

[tool.poe.tasks.test-serial-stages]
help = "Run the whole suite serially with dependencies already prepared"
cmd = "pytest"

[tool.poe.tasks.test-fresh]
help = "Start testing dependencies and recreate the host core test databases"
cmd = "python -m scripts.manage_platform testing-test-host-fresh"

[tool.poe.tasks.test-fresh-stages]
help = "Run both stages with fresh core databases and prepared dependencies"
sequence = ["test-core-fresh", "test-security-timing"]

[tool.poe.tasks.test-unit]
help = "Run focused unit tests without the whole-suite coverage gate"
cmd = "pytest -m unit --no-cov"

[tool.poe.tasks.test-integration]
help = "Start testing dependencies and run focused host integration tests"
cmd = "python -m scripts.manage_platform testing-test-host-integration"

[tool.poe.tasks.test-integration-stages]
help = "Run focused integration tests with dependencies already prepared"
cmd = """pytest -n auto --dist loadgroup
  -m "integration and not security_timing"
  --no-cov
  --max-worker-restart=0"""

[tool.poe.tasks.test-parallel]
help = "Alias of the default test task, retained for scripts that name it"
sequence = ["test"]

[tool.poe.tasks.test-core]
help = "Run the core suite in high-parallel mode with 100 percent branch coverage"
cmd = """pytest -n auto --dist loadgroup
  -m "not security_timing"
  --max-worker-restart=0
  --junitxml=test-results/pytest-core.xml"""

[tool.poe.tasks.test-core-fresh]
help = "Run the core suite after recreating its test databases"
cmd = """pytest -n auto --dist loadgroup --create-db
  -m "not security_timing"
  --max-worker-restart=0
  --junitxml=test-results/pytest-core.xml"""

[tool.poe.tasks.test-security-timing]
help = "Run every statistical credential timing case with four independent workers"
cmd = """pytest -n 4 --dist load
  -m security_timing
  --no-cov
  --max-worker-restart=0
  --junitxml=test-results/pytest-security-timing.xml
  --log-level=INFO
  -o junit_logging=all"""

[tool.poe.tasks.check]
help = "Run the complete local quality gate"
sequence = ["django-check", "openapi-check", "format-check", "lint", "docs-standard", "typecheck", "architecture-audit", "test"]
